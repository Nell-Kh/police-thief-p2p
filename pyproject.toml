[project]
name = "police-thief-p2p"
version = "1.00"
description = "Distributed Cops-and-Robbers over a Peer-to-Peer network (FastMCP) - University of Haifa final project 2026"
authors = [{ name = "nell", email = "nellkh2007@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "anthropic>=0.40",
    "tomli>=2.4.1",
]

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/police_thief"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/police_thief --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src"]
omit = ["src/police_thief/__main__.py", "*/tests/*", "src/police_thief/gui/*"]

[tool.coverage.report]
fail_under = 85
